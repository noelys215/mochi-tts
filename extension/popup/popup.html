<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi Audio</title>
    <link rel="icon" type="image/png" href="../assets/mochi.png" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="../assets/mochi.png" alt="" width="56" height="56" />
        <div>
          <h1>Mochi Audio</h1>
          <p id="status" role="status" aria-live="polite" aria-atomic="true">Ready.</p>
        </div>
      </header>

      <section aria-labelledby="read-heading">
        <h2 id="read-heading">Read</h2>
        <div class="two-column">
          <button id="read-selection" type="button">Read selection</button>
          <button id="read-article" type="button">Read page</button>
        </div>
      </section>

      <section aria-labelledby="page-controls-heading">
        <h2 id="page-controls-heading">Page controls</h2>
        <div class="toggle-list">
          <button id="hover-toggle" type="button" aria-pressed="false">Hover mode: Off</button>
          <button id="in-page-toggle" type="button" aria-pressed="false">Passage controls: Off</button>
        </div>
      </section>

      <section id="article-preview" aria-labelledby="article-heading" hidden>
        <h2 id="article-heading">Review page</h2>
        <label>Extracted text
          <textarea id="article-speech" rows="8"></textarea>
        </label>
        <p id="article-estimate" class="fine-print">Calculating estimate…</p>
        <div class="two-column">
          <button id="confirm-article" type="button">Confirm and read</button>
          <button id="cancel-article" type="button">Cancel</button>
        </div>
      </section>

      <section aria-labelledby="playback-heading">
        <h2 id="playback-heading">Playback</h2>
        <div class="transport-controls">
          <button type="button" data-queue="QUEUE_PREVIOUS" aria-label="Previous chunk">Previous</button>
          <button id="playback-toggle" type="button" aria-label="Play">Play</button>
          <button type="button" data-queue="QUEUE_NEXT" aria-label="Next chunk">Next</button>
          <button id="playback-stop" type="button">Stop</button>
        </div>
        <input id="playback-progress" type="range" min="0" max="0" value="0" step="0.1" aria-label="Playback position" disabled>
        <div class="playback-meta">
          <span id="playback-time">0:00 / 0:00</span>
          <label>Speed
            <select id="playback-rate">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
      </section>

      <section aria-labelledby="usage-heading">
        <h2 id="usage-heading">Usage</h2>
        <dl class="usage-summary">
          <div><dt>Today</dt><dd id="usage-today">0 bytes · $0.00</dd></div>
          <div><dt>This month</dt><dd id="usage-month">0 bytes · $0.00</dd></div>
          <div><dt>Plan</dt><dd id="budget-status">Free mode</dd></div>
        </dl>
      </section>

      <section id="budget-warning" class="warning" hidden>
        <p>Monthly spending limit reached.</p>
        <button id="override-once" type="button">Allow once</button>
      </section>

      <nav class="page-links" aria-label="Extension pages">
        <button id="open-options" type="button">Settings</button>
        <button id="open-history" type="button">History</button>
      </nav>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
