<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fish Study Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Fish Study Reader</h1>
      <p>Select text on the page, then read it through your local speech server.</p>
      <button id="read-selection" type="button">Read selection</button>
      <button id="hover-toggle" type="button" aria-pressed="false">
        Enable hover mode
      </button>
      <section aria-labelledby="playback-heading">
        <h2 id="playback-heading">Playback</h2>
        <div class="transport-controls">
          <button type="button" data-queue="QUEUE_PREVIOUS">Previous</button>
          <button type="button" data-queue="QUEUE_NEXT">Next</button>
          <button type="button" data-playback="PLAYBACK_PLAY">Play</button>
          <button type="button" data-playback="PLAYBACK_PAUSE">Pause</button>
          <button type="button" data-playback="PLAYBACK_RESUME">Resume</button>
          <button type="button" data-playback="PLAYBACK_STOP">Stop</button>
          <button type="button" data-queue="QUEUE_CLEAR">Clear</button>
          <button type="button" data-seek="-10">−10s</button>
          <button type="button" data-seek="10">+10s</button>
          <label>
            Speed
            <select id="playback-rate">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
      </section>
      <section aria-labelledby="usage-heading">
        <h2 id="usage-heading">Usage estimates</h2>
        <dl id="usage-summary">
          <div><dt>Current</dt><dd id="usage-current">—</dd></div>
          <div><dt>Today</dt><dd id="usage-today">0 bytes · $0.000000</dd></div>
          <div><dt>This month</dt><dd id="usage-month">0 bytes · $0.000000</dd></div>
        </dl>
        <p class="fine-print">Local estimates only. Not an invoice.</p>
        <div class="utility-controls">
          <button id="export-usage" type="button">Export JSON</button>
          <button id="reset-usage" type="button">Reset usage</button>
        </div>
      </section>
      <section aria-labelledby="budget-heading">
        <h2 id="budget-heading">Spending safeguards</h2>
        <label>Pricing mode
          <select id="pricing-mode">
            <option value="free">Free</option>
            <option value="paid">Paid server estimate</option>
            <option value="custom">Custom estimate</option>
          </select>
        </label>
        <label>Custom price / million bytes (USD)
          <input id="custom-price" type="number" min="0" step="0.000001">
        </label>
        <label>Monthly limit (USD)
          <input id="monthly-limit" type="number" min="0" step="0.01">
        </label>
        <label>Warning threshold (%)
          <input id="warning-threshold" type="number" min="1" max="100">
        </label>
        <label class="checkbox"><input id="hard-stop" type="checkbox"> Hard stop at limit</label>
        <div class="utility-controls">
          <button id="save-budget" type="button">Save</button>
          <button id="override-once" type="button">Allow once</button>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite">Ready.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
